version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /opt/company-data
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /sandbox/shared

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  npm:
    name: npm
    endpoints:
      - host: registry.npmjs.org
        port: 443
    binaries:
      - path: /usr/bin/node
      - path: /usr/bin/npm
      - path: /usr/bin/npx

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /sandbox/.venv/bin/pip
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3
      - path: /usr/local/bin/uv

  azure:
    name: azure
    endpoints:
      - host: management.azure.com
        port: 443
      - host: login.microsoftonline.com
        port: 443
      - host: graph.microsoft.com
        port: 443
    binaries:
      - path: /usr/bin/az
      - path: /bin/bash

  azure_devops:
    name: azure-devops
    endpoints:
      - host: dev.azure.com
        port: 443
      - host: vssps.dev.azure.com
        port: 443
      - host: pkgs.dev.azure.com
        port: 443
    binaries:
      - path: /usr/bin/git
      - path: /usr/bin/curl
      - path: /bin/bash

  microsoft_identity:
    name: microsoft-identity
    endpoints:
      - host: login.microsoftonline.com
        port: 443
      - host: login.live.com
        port: 443
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/node
      - path: /bin/bash

  openclaw_from_git:
    name: openclaw-from-git
    endpoints:
      - host: github.com
        port: 443
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
      - host: codeload.github.com
        port: 443
      - host: raw.githubusercontent.com
        port: 443
      - host: registry.npmjs.org
        port: 443
    binaries:
      - path: /usr/bin/node
      - path: /usr/bin/npm
      - path: /usr/bin/npx
      - path: /usr/bin/git
      - path: /usr/bin/curl
      - path: /bin/bash

  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
    binaries:
      - path: /usr/bin/git

  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
          - allow:
              method: HEAD
              path: "/**"
          - allow:
              method: OPTIONS
              path: "/**"
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/gh

  allow_navigator_navigator_svc_cluster_local_8080:
    name: allow_navigator_navigator_svc_cluster_local_8080
    endpoints:
      - host: navigator.navigator.svc.cluster.local
        port: 8080
    binaries:
      - path: /usr/bin/node

  allow_registry_npmjs_org_443:
    name: allow_registry_npmjs_org_443
    endpoints:
      - host: registry.npmjs.org
        port: 443
    binaries:
      - path: /usr/bin/node

  claude_code:
    name: claude_code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
        tls: terminate
      - host: statsig.anthropic.com
        port: 443
      - host: sentry.io
        port: 443
      - host: raw.githubusercontent.com
        port: 443
      - host: platform.claude.com
        port: 443
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/node

  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
    binaries:
      - path: /usr/bin/curl
      - path: /bin/bash
      - path: /usr/local/bin/opencode
      - path: /usr/bin/python3
      - path: /usr/bin/python3.12

  nvidia_web:
    name: nvidia_web
    endpoints:
      - host: nvidia.com
        port: 443
      - host: www.nvidia.com
        port: 443
    binaries:
      - path: /usr/bin/curl
