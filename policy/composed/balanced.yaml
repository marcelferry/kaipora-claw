version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /opt/company-data
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /sandbox/shared

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  npm:
    name: npm
    endpoints:
      - host: registry.npmjs.org
        port: 443
    binaries:
      - path: /usr/bin/node
      - path: /usr/bin/npm
      - path: /usr/bin/npx
  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /sandbox/.venv/bin/pip
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3
      - path: /usr/local/bin/uv
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/git
      - path: /usr/bin/gh
      - path: /usr/bin/curl
