version: 1
network_policies:
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
      - host: release-assets.githubusercontent.com
        port: 443
    binaries:
      - path: /usr/bin/git
      - path: /usr/bin/gh
      - path: /usr/bin/curl
