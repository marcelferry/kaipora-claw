version: 1
network_policies:
  google_apis:
    name: google-apis
    endpoints:
      - host: www.googleapis.com
        port: 443
      - host: oauth2.googleapis.com
        port: 443
      - host: accounts.google.com
        port: 443
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/node
      - path: /bin/bash
