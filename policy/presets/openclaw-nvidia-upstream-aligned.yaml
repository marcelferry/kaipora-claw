version: 1
network_policies:
  allow_navigator_navigator_svc_cluster_local_8080:
    name: allow_navigator_navigator_svc_cluster_local_8080
    endpoints:
      - host: navigator.navigator.svc.cluster.local
        port: 8080
    binaries:
      - path: /usr/bin/node

  allow_registry_npmjs_org_443:
    name: allow_registry_npmjs_org_443
    endpoints:
      - host: registry.npmjs.org
        port: 443
    binaries:
      - path: /usr/bin/node

  claude_code:
    name: claude_code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
        tls: terminate
      - host: statsig.anthropic.com
        port: 443
      - host: sentry.io
        port: 443
      - host: raw.githubusercontent.com
        port: 443
      - host: platform.claude.com
        port: 443
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/node

  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**/info/refs*"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
    binaries:
      - path: /usr/bin/git

  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
    binaries:
      - path: /usr/bin/curl
      - path: /bin/bash
      - path: /usr/local/bin/opencode
      - path: /usr/bin/python3
      - path: /usr/bin/python3.12

  nvidia_web:
    name: nvidia_web
    endpoints:
      - host: nvidia.com
        port: 443
      - host: www.nvidia.com
        port: 443
    binaries:
      - path: /usr/bin/curl

  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
          - allow:
              method: HEAD
              path: "/**"
          - allow:
              method: OPTIONS
              path: "/**"
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/gh
