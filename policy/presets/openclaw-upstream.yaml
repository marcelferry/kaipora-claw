network_policies:
  claude_code:
    name: claude_code
    binaries:
      - /usr/local/bin/claude
      - /usr/bin/node
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
        tls: terminate
      - host: statsig.anthropic.com
        port: 443
      - host: sentry.io
        port: 443
      - host: raw.githubusercontent.com
        port: 443
      - host: platform.claude.com
        port: 443
  nvidia:
    name: nvidia
    binaries:
      - /usr/bin/curl
      - /bin/bash
      - /usr/local/bin/opencode
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
  nvidia_web:
    name: nvidia_web
    binaries:
      - /usr/bin/curl
    endpoints:
      - host: nvidia.com
        port: 443
      - host: www.nvidia.com
        port: 443
  github_rest_api:
    name: github-rest-api
    binaries:
      - /usr/local/bin/claude
      - /usr/bin/gh
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
          - allow:
              method: HEAD
              path: "/**"
          - allow:
              method: OPTIONS
              path: "/**"
