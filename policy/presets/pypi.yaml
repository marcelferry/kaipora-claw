network_policies:
  pypi:
    name: pypi
    binaries:
      - /sandbox/.venv/bin/pip
      - /sandbox/.venv/bin/python
      - /sandbox/.venv/bin/python3
      - /usr/local/bin/pip
      - /usr/local/bin/python
      - /usr/local/bin/python3
      - /usr/local/bin/uv
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
