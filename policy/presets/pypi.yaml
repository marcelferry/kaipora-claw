version: 1
network_policies:
  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /sandbox/.venv/bin/pip
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3
      - path: /usr/local/bin/uv
